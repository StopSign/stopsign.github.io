<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="cache-control" content="max-age=0" />
    <meta http-equiv="cache-control" content="no-cache" />
    <meta http-equiv="expires" content="0" />
    <meta http-equiv="pragma" content="no-cache" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Skill Data Helper</title>
    <link rel="stylesheet" href="stylesheet.css">
    <link rel="stylesheet" href="skillHelper.css">
</head>
<body class="sh-body">
    <div class="sh-page">
        <header class="sh-header">
            <div class="sh-header-row">
                <h1>Skill Data Helper</h1>
                <a class="tab-button sh-back" href="index.html">Back to game</a>
            </div>
            <p class="muted-text sh-lede">Combat skill effects and exp at levels 0 / 50 / 100 from <code>skills.js</code>.</p>
        </header>

        <section class="sh-toolbar">
            <div class="sh-counts">
                <span id="shTotal">Total skills: 0</span>
                <span id="shShowing" hidden>Showing 0</span>
            </div>
            <input type="search" id="shSearch" class="skills-list-search" placeholder="Search skills…" autocomplete="off" spellcheck="false">
            <div class="sh-radio-row">
                <span class="muted-text">Slot</span>
                <label><input type="radio" name="shSlot" value="all" checked> All</label>
                <label><input type="radio" name="shSlot" value="offense"> Offense</label>
                <label><input type="radio" name="shSlot" value="defense"> Defense</label>
                <label><input type="radio" name="shSlot" value="utility"> Utility</label>
            </div>
            <div class="sh-radio-row">
                <label><input type="radio" name="shSort" value="alpha" checked> Sort Alphabetically</label>
                <label><input type="radio" name="shSort" value="slot"> Sort by Slot Category</label>
            </div>
        </section>

        <p id="shEmpty" class="muted-text" hidden>No skills match.</p>
        <div id="shSkillList" class="sh-skill-list"></div>
    </div>

    <script>
        (function loadHelperScripts() {
            const v = Date.now();
            const files = ["helpers.js", "gameData.js", "skills.js", "skillHelper.js"];
            let i = 0;
            function next() {
                if (i >= files.length) {
                    skillHelper.init();
                    return;
                }
                const s = document.createElement("script");
                s.src = files[i++] + "?t=" + v;
                s.onload = next;
                s.onerror = function() {
                    console.error("Failed to load " + s.src);
                };
                document.body.appendChild(s);
            }
            next();
        })();
    </script>
</body>
</html>
